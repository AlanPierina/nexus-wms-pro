<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS WMS Pro - App Coletor Mobile</title>
  
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            darkbg: '#07090e',
            darkcard: 'rgba(17, 24, 39, 0.8)',
            darkborder: 'rgba(255, 255, 255, 0.08)',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Google Font & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML5-QRCode Scanner SDK -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0b0f19 50%, #030712 100%);
      background-attachment: fixed;
      color: #f3f4f6;
      touch-action: manipulation;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    
    .glass-panel { 
      background: rgba(15, 23, 42, 0.9); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-card { 
      background: rgba(30, 41, 59, 0.6); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06); 
    }
    .glass-input { 
      background: rgba(11, 15, 25, 0.95); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      color: #fff; 
      font-size: 0.9rem; 
    }
    .glass-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25); }

    select.glass-input option { background-color: #0f172a; color: #ffffff; padding: 12px; }

    .laser-line {
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 12px 2px #ef4444;
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      animation: scan 2s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 20%; }
      50% { top: 80%; }
      100% { top: 20%; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white pb-20">

  <header class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
        <i data-lucide="smartphone" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-bold text-sm tracking-wide text-white">NEXUS <span class="text-blue-400 font-extrabold">COLETOR</span></h1>
          <span class="px-1.5 py-0.5 text-[9px] bg-blue-500/20 text-blue-400 rounded-full border border-blue-500/30 font-bold">v7.8</span>
        </div>
        <p class="text-[10px] text-emerald-400 font-semibold" id="mob-user-display">Operação Coletor</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a href="index.html" class="px-2.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl border border-white/10 text-blue-400 font-bold flex items-center gap-1 shadow cursor-pointer" title="Ir para o Portal Web">
        <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
        <span>Web</span>
      </a>

      <button type="button" onclick="openMobScanner('mob-search')" class="p-2.5 bg-blue-600 active:bg-blue-700 text-white rounded-xl shadow-lg flex items-center justify-center cursor-pointer">
        <i data-lucide="scan" class="w-5 h-5"></i>
      </button>
      <button type="button" onclick="handleMobLogout()" class="p-2.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl border border-rose-500/20 cursor-pointer" title="Sair">
        <i data-lucide="log-out" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <div id="modal-mob-scanner" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between p-4 overflow-hidden">
    <div class="flex items-center justify-between border-b border-white/10 pb-3 z-10 bg-slate-950/80 px-2 rounded-xl">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <h3 class="font-bold text-xs uppercase tracking-wider text-white">Leitor de Câmera Ativo</h3>
      </div>
      <button type="button" onclick="forceCloseMobScanner()" class="px-4 py-2 bg-rose-600 active:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-lg flex items-center gap-1 cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i> Voltar / Sair
      </button>
    </div>

    <div class="relative w-full max-w-sm mx-auto my-auto rounded-3xl overflow-hidden border-2 border-blue-500/40 bg-black min-h-[280px] flex items-center justify-center shadow-2xl">
      <div id="mob-reader" class="w-full h-full"></div>
      <div class="laser-line pointer-events-none"></div>
    </div>

    <div class="space-y-3 z-10 max-w-sm mx-auto w-full text-center pb-2">
      <p class="text-xs text-gray-300">Aponte a câmera para o código de barras ou QR Code...</p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="restartScanner()" class="py-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-blue-400 font-bold rounded-xl text-xs border border-white/10 flex items-center justify-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reiniciar Câmera
        </button>
        <button type="button" onclick="forceCloseMobScanner()" class="py-3 bg-rose-600/20 active:bg-rose-600 text-rose-300 font-bold rounded-xl text-xs border border-rose-500/30 flex items-center justify-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Cancelar Leitura
        </button>
      </div>
    </div>
  </div>

  <main class="flex-1 p-4 space-y-4 max-w-md mx-auto w-full">

    <div id="mob-tab-skus" class="space-y-4">
      <div class="glass-card p-3 rounded-2xl border border-white/5 space-y-2">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3.5"></i>
          <input type="text" id="mob-search" onkeyup="renderMobSkus()" placeholder="Bipar código ou pesquisar SKU/Nome..." class="w-full glass-input pl-9 pr-10 py-3 rounded-xl text-xs font-semibold">
          <button type="button" onclick="openMobScanner('mob-search')" class="absolute right-2 top-2 p-1.5 text-blue-400 hover:text-white cursor-pointer">
            <i data-lucide="camera" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div id="mob-sku-list" class="space-y-3"></div>
    </div>

    <!-- REQUISIÇÃO MOBILE COM CAMPOS INDEPENDENTES -->
    <div id="mob-tab-requisicao" class="hidden space-y-4">
      <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-3">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-amber-400"></i> Registrar Saída para Frota
        </h2>

        <form onsubmit="submitMobRequisition(event)" class="space-y-3 text-xs">
          <div>
            <label class="text-gray-300 block mb-1 font-semibold text-emerald-400">Quem Retirou (Requisitante) *</label>

            <select id="mob-req-user" required class="w-full glass-input px-3 py-2.5 rounded-xl font-semibold text-amber-400"></select>
          </div>
          <div>
            <label class="text-gray-300 block mb-1">Equipamento / Trator / Frota *</label>
            <input type="text" id="mob-req-fleet" required placeholder="Ex: Trator JD 04 / Placa ABC-1234" class="w-full glass-input px-3 py-2.5 rounded-xl font-semibold text-amber-400">
          </div>
          <div>
            <label class="text-gray-300 block mb-1">Material / SKU *</label>
            <div class="relative">

            </div>
          </div>

            <div>
              <label class="text-gray-300 block mb-1">Quantidade *</label>
              <input type="number" id="mob-req-qty" min="1" value="1" required class="w-full glass-input px-3 py-2.5 rounded-xl font-bold text-emerald-400">
            </div>
            <div>
              <label class="text-gray-300 block mb-1">Centro Custo *</label>
              <input type="text" id="mob-req-cc" value="CC-101 Manutenção" required class="w-full glass-input px-3 py-2.5 rounded-xl">
            </div>
          </div>
          <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-600 to-orange-600 active:from-amber-700 active:to-orange-700 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 text-xs cursor-pointer">
            <i data-lucide="check-circle" class="w-4 h-4"></i> Confirmar Saída no Coletor
          </button>
        </form>
      </div>
    </div>

    <div id="mob-tab-compras" class="hidden space-y-4">
      <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-1">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-400"></i> Previsão de Ruptura (BI)
        </h2>
        <p class="text-[11px] text-gray-400">Itens com risco de desabastecimento em breve</p>
      </div>

      <div id="mob-compras-list" class="space-y-3"></div>
    </div>

    <div id="mob-tab-historico" class="hidden space-y-4">
      <div class="glass-card p-4 rounded-2xl border border-white/5 space-y-1">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-blue-400"></i> Últimas Saídas Registradas
        </h2>
      </div>

      <div id="mob-req-list" class="space-y-3"></div>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-white/10 px-2 py-2 flex items-center justify-around text-[10px]">
    <button type="button" onclick="switchMobTab('skus')" id="mob-nav-skus" class="flex flex-col items-center gap-1 text-blue-400 font-bold p-1 cursor-pointer">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span>Estoque</span>
    </button>
    <button type="button" onclick="switchMobTab('requisicao')" id="mob-nav-requisicao" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white p-1 cursor-pointer">
      <i data-lucide="plus-circle" class="w-5 h-5"></i>
      <span>Nova Saída</span>
    </button>
    <button type="button" onclick="switchMobTab('compras')" id="mob-nav-compras" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white p-1 cursor-pointer">
      <i data-lucide="shopping-cart" class="w-5 h-5"></i>
      <span>Ruptura BI</span>
    </button>
    <button type="button" onclick="switchMobTab('historico')" id="mob-nav-historico" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white p-1 cursor-pointer">
      <i data-lucide="history" class="w-5 h-5"></i>
      <span>Histórico</span>
    </button>
  </nav>

  <div id="modal-mob-adjust" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-xs rounded-2xl border border-white/10 p-5 space-y-4">
      <h3 class="text-xs font-bold text-white uppercase tracking-wider">Ajuste de Saldo Físico</h3>
      <p id="mob-adjust-title" class="text-xs text-blue-400 font-semibold">---</p>
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="text-gray-300 block mb-1">Novo Saldo Contado *</label>
          <input type="number" id="mob-adjust-newqty" class="w-full glass-input px-3 py-2 rounded-xl text-sm font-bold text-emerald-400">
        </div>
        <div>
          <label class="text-gray-300 block mb-1">Motivo *</label>
          <input type="text" id="mob-adjust-reason" value="Contagem física coletor" class="w-full glass-input px-3 py-2 rounded-xl">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeMobAdjustModal()" class="flex-1 py-2 bg-slate-800 text-gray-300 text-xs rounded-xl font-bold cursor-pointer">Cancelar</button>
        <button type="button" onclick="confirmMobAdjust()" class="flex-1 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow cursor-pointer">Salvar Saldo</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-16 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const SUPABASE_URL = 'https://qnxqrimsgehthjgksuqa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_secret_8r2ctf2pAY-aQRBPQL1_Sw_AqEZmH5U';

    const WHATSAPP_CONFIG = {

      apiUrl: "https://api.z-api.io/instances/SUA_INSTANCIA/token/SEU_TOKEN/send-text"

    async function enviarNotificacaoMovimentacaoWhatsApp(dados) {
      const textoMensagem = 
        `🚨 *NEXUS WMS - MOVIMENTAÇÃO DE ESTOQUE (COLETOR)*\n\n` +
        `👤 *Responsável:* ${dados.usuario}\n` +
        `📦 *SKU:* ${dados.skuCode} - ${dados.nomeMaterial}\n` +
        `🔄 *Tipo de Ação:* ${dados.tipoAcao}\n` +
        `📊 *Variação:* ${dados.qtdDiferenca > 0 ? '+' : ''}${dados.qtdDiferenca} UN\n` +
        `📈 *Novo Saldo Total:* ${dados.saldoAtual} UN\n` +
        `📍 *Local:* ${dados.localizacao || 'Almoxarifado'}\n` +
        `⏰ *Data/Hora:* ${new Date().toLocaleString('pt-BR')}`;

      await dispararMensagemWhatsApp(textoMensagem);
    }

    async function enviarAlertaItensCriticosWhatsApp() {
      const itensCriticos = mobSkus.filter(s => s.qty <= s.min);

      if (itensCriticos.length === 0) {
        showToast("Nenhum item em estado crítico!", "info");
        return;
      }

      let listaTexto = "";
      itensCriticos.forEach((item, index) => {
        const falta = item.min - item.qty;
        listaTexto += `\n${index + 1}. *${item.code}* - ${item.name}\n` +
                      `   • Saldo Atual: *${item.qty} ${item.unit}* (Mínimo: ${item.min})\n` +
                      `   • Reposição Mínima: *+${falta} ${item.unit}*\n` +
                      `   • Local: \`${item.loc}\`\n`;
      });

      const textoMensagem = 
        `⚠️ *NEXUS WMS - ALERTA DE REPOSIÇÃO CRÍTICA*\n` +
        `📋 *Total de itens em risco:* ${itensCriticos.length}\n` +
        `________________________________________\n` +
        listaTexto +
        `________________________________________\n` +
        `💡 *Ação Sugerida:* Gerar Ordem de Compra Imediata no BI.`;

      await dispararMensagemWhatsApp(textoMensagem);
      showToast(`Alerta de ${itensCriticos.length} itens críticos enviado via WhatsApp!`, "success");
    }

    async function dispararMensagemWhatsApp(mensagemTexto) {
      try {
        await fetch(WHATSAPP_CONFIG.apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: WHATSAPP_CONFIG.numeroDestino,
            message: mensagemTexto
          })
        });
        showToast("WhatsApp notificado com sucesso!", "success");
      } catch (error) {
        showToast("Alerta WhatsApp processado para 5518988055912!", "success");
      }
    }

    let mobSkus = [];
    let mobRequisicoes = [];
    let mobColaboradores = [];
    let activeMobSkuItem = null;
    let mobQrcodeScanner = null;
    let mobTargetInputId = null;

    const FALLBACK_COLABORADORES = [
      { id: '1', nome: 'Rafael', cargo: 'Almoxarife / ADM' },
      { id: '2', nome: 'Rubens', cargo: 'Almoxarife' },
      { id: '3', nome: 'João', cargo: 'Almoxarife' },
      { id: '4', nome: 'Nathan', cargo: 'Almoxarife' }
    ];

    const FALLBACK_SKUS = [
      { id: '1', code: 'EPI-CAP-01', lote: 'LOT-2026-A', name: 'Capacete de Segurança MSA', category: 'EPIs', unit: 'UN', min: 10, max: 60, qty: 38, cost: 45.00, loc: 'RACK-B1', abc: 'B' },
      { id: '2', code: 'ROL-6205', lote: 'LOT-2026-B', name: 'Rolamento SKF 6205-2RS', category: 'Peças', unit: 'UN', min: 15, max: 80, qty: 12, cost: 32.50, loc: 'RACK-A2', abc: 'A' },
      { id: '3', code: 'FER-CHV-13', lote: 'LOT-2025-C', name: 'Chave Combinada 13mm', category: 'Ferramentas', unit: 'UN', min: 5, max: 20, qty: 4, cost: 18.90, loc: 'RACK-B2', abc: 'C' },
      { id: '4', code: 'INS-DIS-07', lote: 'LOT-2026-X', name: 'Disco de Corte Inox Norton', category: 'Insumos', unit: 'CX', min: 20, max: 100, qty: 85, cost: 110.00, loc: 'RACK-A1', abc: 'A' },
    ];

    window.onload = function() {
      if (window.lucide) lucide.createIcons();
      fetchMobData();

      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') forceCloseMobScanner();
      });
    };

    async function fetchMobData() {
      mobColaboradores = FALLBACK_COLABORADORES;
      mobSkus = FALLBACK_SKUS;
      mobRequisicoes = [
        { id: 'REQ-101', reqBy: 'Lucas Lima (Mecânico)', almoxarife: 'João', cc: 'CC-101', fleet: 'Colhedora Case 8810', skuCode: 'ROL-6205', qty: 4, status: 'Aprovada' }
      ];

      renderMobSkus();
      renderMobSelects();
      renderMobCompras();
      renderMobReqs();
    }

    function switchMobTab(tabId) {
      ['skus', 'requisicao', 'compras', 'historico'].forEach(t => {
        const page = document.getElementById(`mob-tab-${t}`);
        if (page) page.classList.add('hidden');
        const nav = document.getElementById(`mob-nav-${t}`);
        if (nav) nav.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-white p-1 cursor-pointer";
      });

      const activePage = document.getElementById(`mob-tab-${tabId}`);
      if (activePage) activePage.classList.remove('hidden');
      const activeNav = document.getElementById(`mob-nav-${tabId}`);
      if (activeNav) activeNav.className = "flex flex-col items-center gap-1 text-blue-400 font-bold p-1 cursor-pointer";

      if (tabId === 'compras') renderMobCompras();
    }

    function renderMobSkus() {
      const listEl = document.getElementById('mob-sku-list');
      const search = document.getElementById('mob-search').value.toLowerCase();
      if (!listEl) return;
      listEl.innerHTML = '';

      mobSkus.filter(s => s.name.toLowerCase().includes(search) || s.code.toLowerCase().includes(search) || s.lote.toLowerCase().includes(search))
        .forEach(item => {
          let badge = `<span class="px-2.5 py-0.5 text-[10px] rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">OK (${item.qty})</span>`;
          if (item.qty <= item.min) badge = `<span class="px-2.5 py-0.5 text-[10px] rounded-full bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30">Crítico (${item.qty})</span>`;
          if (item.qty === 0) badge = `<span class="px-2.5 py-0.5 text-[10px] rounded-full bg-rose-500/20 text-rose-400 font-bold border border-rose-500/30">Zerado</span>`;

          listEl.innerHTML += `
            <div class="glass-card p-3.5 rounded-2xl border border-white/5 space-y-2 shadow">
              <div class="flex justify-between items-start">
                <div>
                  <span class="font-mono font-extrabold text-blue-400 text-xs block">${item.code}</span>
                  <h3 class="font-bold text-white text-xs">${item.name}</h3>
                </div>
                ${badge}
              </div>

              <div class="flex items-center justify-between text-[11px] text-gray-400 border-t border-white/5 pt-2">
                <span>RACK: <strong class="text-emerald-400 font-mono">${item.loc}</strong></span>
                <span>LOTE: <strong class="text-gray-200 font-mono">${item.lote}</strong></span>
                <button type="button" onclick="openMobAdjustModal('${item.id}')" class="px-2.5 py-1 bg-blue-600/30 active:bg-blue-600 text-blue-300 active:text-white rounded-xl font-semibold text-[10px] cursor-pointer">
                  Ajustar
                </button>
              </div>
            </div>
          `;
        });
    }

    function renderMobCompras() {
      const listEl = document.getElementById('mob-compras-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      mobSkus.forEach(item => {
        let consumoDiario = item.abc === 'A' ? 3.0 : (item.abc === 'B' ? 1.5 : 0.5);
        let dias = Math.floor(item.qty / consumoDiario);

        let badgeClass = dias <= 5 ? 'text-rose-400 font-bold' : 'text-emerald-400 font-bold';

        listEl.innerHTML += `
          <div class="glass-card p-3.5 rounded-2xl border border-white/5 space-y-2 shadow">
            <div class="flex justify-between items-center">
              <span class="font-mono font-bold text-blue-400 text-xs">${item.code}</span>
              <span class="text-[11px] ${badgeClass}">${dias} Dias p/ Ruptura</span>
            </div>
            <p class="text-xs text-white font-semibold">${item.name}</p>
            <div class="flex justify-between items-center text-[10px] text-gray-400 border-t border-white/5 pt-2">
              <span>Atual: <strong class="text-white">${item.qty} ${item.unit}</strong></span>
              <span>Min: <strong class="text-gray-300">${item.min} ${item.unit}</strong></span>
              <button type="button" onclick="showToast('Solicitação enviada ao BI!', 'success')" class="px-2.5 py-1 bg-emerald-600 text-white rounded-xl font-bold cursor-pointer">Solicitar</button>
            </div>
          </div>
        `;
      });
    }

    function renderMobReqs() {
      const listEl = document.getElementById('mob-req-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      mobRequisicoes.forEach(r => {
        listEl.innerHTML += `
          <div class="glass-card p-3.5 rounded-2xl border border-white/5 space-y-1 text-xs shadow">
            <div class="flex justify-between font-mono font-bold text-gray-300">
              <span>${r.id}</span>
              <span class="text-emerald-400">✓ ${r.status}</span>
            </div>
            <p class="font-bold text-white">Retirado por: <span class="text-emerald-400">${r.reqBy}</span></p>
            <p class="font-bold text-amber-400">Liberado por: ${r.almoxarife}</p>
            <p class="text-[11px] text-amber-300">Frota: ${r.fleet}</p>
            <p class="text-[11px] text-blue-300">Item: ${r.qty}x ${r.skuCode}</p>
          </div>
        `;
      });
    }

    function renderMobSelects() {
      const selSku = document.getElementById('mob-req-sku');
      if (selSku) {
        selSku.innerHTML = '<option value="">-- Selecione o Material --</option>';
        mobSkus.forEach(s => {
          selSku.innerHTML += `<option value="${s.code}">${s.code} - ${s.name} (Disp: ${s.qty})</option>`;
        });
      }

      const selUser = document.getElementById('mob-req-user');
      if (selUser) {
        selUser.innerHTML = mobColaboradores.map(c => `<option value="${c.nome}">${c.nome} (${c.cargo})</option>`).join('');
      }
    }

    async function submitMobRequisition(e) {
      e.preventDefault();
      const requisitante = document.getElementById('mob-req-requisitante').value;
      const almoxarife = document.getElementById('mob-req-user').value;
      const fleet = document.getElementById('mob-req-fleet').value;
      const skuCode = document.getElementById('mob-req-sku').value;
      const qty = parseInt(document.getElementById('mob-req-qty').value);
      const cc = document.getElementById('mob-req-cc').value;

      const sku = mobSkus.find(s => s.code === skuCode);
      if (!sku || sku.qty < qty) {
        showToast('Estoque insuficiente!', 'error');
        return;
      }

      sku.qty -= qty;
      const newReq = {
        id: 'REQ-' + Math.floor(1000 + Math.random() * 9000),
        reqBy: requisitante,
        almoxarife: almoxarife,
        cc, fleet, skuCode, qty, status: 'Aprovada'
      };

      mobRequisicoes.unshift(newReq);

      enviarNotificacaoMovimentacaoWhatsApp({
        usuario: almoxarife,
        skuCode: sku.code,
        nomeMaterial: sku.name,
        tipoAcao: `Saída Coletor p/ Frota (${fleet}) - Retirado por: ${requisitante}`,
        qtdDiferenca: -qty,
        saldoAtual: sku.qty,
        localizacao: sku.loc
      });

      if (sku.qty <= sku.min) {
        enviarAlertaItensCriticosWhatsApp();
      }

      renderMobSkus();
      renderMobReqs();
      switchMobTab('historico');
      showToast('Saída efetuada e WhatsApp notificado!', 'success');
    }

    function openMobAdjustModal(id) {
      activeMobSkuItem = mobSkus.find(s => s.id === id);
      if (activeMobSkuItem) {
        document.getElementById('mob-adjust-title').innerText = `${activeMobSkuItem.code} - ${activeMobSkuItem.name}`;
        document.getElementById('mob-adjust-newqty').value = activeMobSkuItem.qty;
        document.getElementById('modal-mob-adjust').classList.remove('hidden');
      }
    }

    function closeMobAdjustModal() {
      document.getElementById('modal-mob-adjust').classList.add('hidden');
    }

    function confirmMobAdjust() {
      if (!activeMobSkuItem) return;
      const newQty = parseInt(document.getElementById('mob-adjust-newqty').value);
      const reason = document.getElementById('mob-adjust-reason').value;

      const diff = newQty - activeMobSkuItem.qty;
      activeMobSkuItem.qty = newQty;

      enviarNotificacaoMovimentacaoWhatsApp({
        usuario: "Coletor Mobile",
        skuCode: activeMobSkuItem.code,
        nomeMaterial: activeMobSkuItem.name,
        tipoAcao: `Ajuste de Coletor (${reason})`,
        qtdDiferenca: diff,
        saldoAtual: newQty,
        localizacao: activeMobSkuItem.loc
      });

      if (newQty <= activeMobSkuItem.min) {
        enviarAlertaItensCriticosWhatsApp();
      }

      renderMobSkus();
      closeMobAdjustModal();
      showToast('Estoque atualizado e notificado no Whats!', 'success');
    }

    function openMobScanner(inputId) {
      mobTargetInputId = inputId;
      document.getElementById('modal-mob-scanner').classList.remove('hidden');

      if (typeof Html5Qrcode !== 'undefined') {
        try {
          mobQrcodeScanner = new Html5Qrcode("mob-reader");
          mobQrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 160 } },
            (decodedText) => {
              if (mobTargetInputId) {
                const field = document.getElementById(mobTargetInputId);
                if (field) {
                  field.value = decodedText.toUpperCase();
                  field.dispatchEvent(new Event('keyup'));
                }
              }
              forceCloseMobScanner();
              showToast(`Bipado: ${decodedText}`, 'success');
            },
            () => {}
          ).catch(() => {});
        } catch(e) {}
      }
    }

    function restartScanner() {
      forceCloseMobScanner();
      setTimeout(() => { openMobScanner(mobTargetInputId || 'mob-search'); }, 300);
    }

    function forceCloseMobScanner() {
      const modal = document.getElementById('modal-mob-scanner');
      if (modal) modal.classList.add('hidden');

      try {
        const videoElements = document.querySelectorAll('#mob-reader video');
        videoElements.forEach(v => {
          if (v.srcObject) {
            v.srcObject.getTracks().forEach(t => t.stop());
          }
        });
      } catch(e) {}

      if (mobQrcodeScanner) {
        try {
          mobQrcodeScanner.stop().catch(() => {}).finally(() => {
            mobQrcodeScanner = null;
            document.getElementById('mob-reader').innerHTML = '';
          });
        } catch(e) {
          mobQrcodeScanner = null;
          document.getElementById('mob-reader').innerHTML = '';
        }
      }
    }

    function handleMobLogout() {
      localStorage.removeItem('nexus_user');
      window.location.href = "index.html";
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      let bg = 'bg-slate-800 border-white/10 text-white';
      if (type === 'success') bg = 'bg-emerald-900/90 border-emerald-500/40 text-emerald-200';
      if (type === 'error') bg = 'bg-rose-900/90 border-rose-500/40 text-rose-200';
      toast.className = `p-3.5 rounded-2xl border glass-panel shadow-2xl text-xs font-semibold flex items-center justify-between transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${bg}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 2500);
    }
  </script>
</body>
</html>
