<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS Coletor - Mobile</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Versão estável do leitor QR/Barcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { background: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
    .glass-input { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
    
    @keyframes scanLine { 0% { top: 10%; opacity: 0.2; } 50% { top: 85%; opacity: 0.9; } 100% { top: 10%; opacity: 0.2; } }
    .scanner-laser { position: absolute; left: 5%; width: 90%; height: 2px; background: #f43f5e; box-shadow: 0 0 12px 3px #f43f5e; animation: scanLine 2.2s infinite ease-in-out; pointer-events: none; z-index: 10; }

    #interactive-reader { width: 100% !important; height: 100% !important; overflow: hidden; position: relative; }
    #interactive-reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 0.75rem; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between p-2 max-w-md mx-auto select-none">

  <!-- TOPO MOBILE -->
  <div class="bg-slate-900 px-4 py-3 rounded-2xl border border-white/10 flex items-center justify-between shrink-0 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-xs font-bold text-white tracking-wider">NEXUS Coletor</span>
    </div>
    <a href="index.html" class="text-[11px] text-blue-400 font-semibold underline">Portal Web</a>
  </div>

  <!-- CONTEÚDO DINÂMICO MOBILE -->
  <div class="flex-1 overflow-y-auto py-3 space-y-4">

    <!-- HOME MOBILE -->
    <div id="mob-page-home" class="space-y-4">
      <div class="glass-card p-4 rounded-2xl border border-blue-500/30 bg-gradient-to-br from-blue-900/40 to-slate-900/80 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] uppercase tracking-widest text-blue-400 font-bold">Operador Ativo</span>
          <i data-lucide="qr-code" class="w-4 h-4 text-blue-400"></i>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-base font-bold text-white shadow">AP</div>
          <div>
            <div class="text-sm font-bold text-white">Alan Kaique</div>
            <div class="text-xs text-gray-400">Operador de Turno</div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="navMobile('scanner')" class="glass-card p-4 rounded-2xl text-center hover:bg-slate-800 transition space-y-2 border border-blue-500/20 shadow">
          <div class="w-10 h-10 mx-auto rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center"><i data-lucide="scan-line" class="w-5 h-5"></i></div>
          <div class="text-xs font-bold text-white">Scanner Câmera</div>
        </button>
        <button onclick="navMobile('inventario')" class="glass-card p-4 rounded-2xl text-center hover:bg-slate-800 transition space-y-2 border border-emerald-500/20 shadow">
          <div class="w-10 h-10 mx-auto rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
          <div class="text-xs font-bold text-white">Coleta Cíclica</div>
        </button>
      </div>

      <button onclick="navMobile('requisitar')" class="w-full glass-card p-4 rounded-2xl flex items-center justify-between hover:bg-slate-800 transition border border-amber-500/20 shadow">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center"><i data-lucide="truck" class="w-5 h-5"></i></div>
          <div class="text-left">
            <div class="text-xs font-bold text-white">Solicitar p/ Frota</div>
            <div class="text-[10px] text-gray-400">Requisição com Equipamento</div>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
      </button>
    </div>

    <!-- SCANNER CÂMERA REAL -->
    <div id="mob-page-scanner" class="hidden space-y-3">
      <div class="text-center"><h3 class="text-sm font-bold text-white">Scanner de Código de Barras</h3></div>
      
      <div class="relative w-full h-56 bg-black rounded-2xl overflow-hidden border-2 border-blue-500/50 flex flex-col items-center justify-center shadow-inner">
        <div class="scanner-laser"></div>
        <div id="interactive-reader" class="w-full h-full"></div>
      </div>

      <div class="flex gap-2">
        <button onclick="startCameraScanner()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow">Ligar Câmera</button>
        <button onclick="stopCameraScanner()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-xl text-xs font-bold shadow">Desligar</button>
      </div>

      <div id="scanned-result-card" class="hidden glass-card p-3 rounded-2xl border border-emerald-500/40 bg-emerald-950/20 space-y-1 text-xs">
        <h4 class="font-bold text-white text-xs" id="scan-res-title">---</h4>
        <p class="text-gray-400 text-[11px]" id="scan-res-sku">SKU: ---</p>
        <p class="text-emerald-400 font-bold text-xs" id="scan-res-qty">0 UN</p>
      </div>
    </div>

    <!-- SOLICITAR FROTA -->
    <div id="mob-page-requisitar" class="hidden space-y-3">
      <div class="text-center"><h3 class="text-sm font-bold text-white">Requisição & Aplicação Frota</h3></div>
      <form onsubmit="submitMobileRequisition(event)" class="space-y-3 text-xs">
        <div>
          <label class="text-gray-400 block mb-1">Solicitante (Retirante) *</label>
          <input type="text" id="mob-req-user" required value="Alan Kaique" class="w-full glass-input px-3 py-2.5 rounded-xl">
        </div>
        <div>
          <label class="text-gray-400 block mb-1">Equipamento / Trator / Frota *</label>
          <input type="text" id="mob-req-fleet" required placeholder="Ex: Trator John Deere 04" class="w-full glass-input px-3 py-2.5 rounded-xl font-semibold text-amber-400">
        </div>
        <div>
          <label class="text-gray-400 block mb-1">Material / SKU *</label>
          <select id="mob-req-sku" required class="w-full glass-input px-3 py-2.5 rounded-xl"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-gray-400 block mb-1">Qtd</label>
            <input type="number" id="mob-req-qty" min="1" value="1" required class="w-full glass-input px-3 py-2.5 rounded-xl">
          </div>
          <div>
            <label class="text-gray-400 block mb-1">Centro Custo</label>
            <input type="text" id="mob-req-cc" value="CC-101 Manutenção" class="glass-input px-3 py-2.5 rounded-xl w-full">
          </div>
        </div>
        <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg">Enviar Solicitação</button>
      </form>
    </div>

    <!-- CONTAGEM CÍCLICA -->
    <div id="mob-page-inventario" class="hidden space-y-3">
      <div class="text-center"><h3 class="text-sm font-bold text-white">Contagem Cíclica</h3></div>
      <div class="glass-card p-4 rounded-2xl border border-white/10 space-y-3 text-xs">
        <div>
          <label class="text-gray-400 block mb-1">Auditor *</label>
          <input type="text" id="mob-inv-user" required value="Alan Kaique" class="w-full glass-input px-3 py-2.5 rounded-xl">
        </div>
        <div>
          <label class="text-gray-400 block mb-1">SKU</label>
          <select id="mob-inv-sku" class="w-full glass-input px-3 py-2.5 rounded-xl"></select>
        </div>
        <div>
          <label class="text-gray-400 block mb-1">Qtd Contada</label>
          <input type="number" id="mob-counted-qty" placeholder="0" class="w-full glass-input px-3 py-2.5 rounded-xl font-bold text-emerald-400">
        </div>
        <button onclick="saveInventoryCount()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">Salvar Contagem</button>
      </div>
    </div>

  </div>

  <!-- MENU INFERIOR -->
  <div class="bg-slate-900 border-t border-white/10 px-4 py-2.5 flex items-center justify-between shrink-0 text-gray-400 text-[10px]">
    <button onclick="navMobile('home')" class="flex flex-col items-center gap-1 text-blue-400"><i data-lucide="home" class="w-4 h-4"></i><span>Início</span></button>
    <button onclick="navMobile('scanner')" class="flex flex-col items-center gap-1 hover:text-white"><i data-lucide="scan" class="w-4 h-4"></i><span>Scanner</span></button>
    <button onclick="navMobile('requisitar')" class="flex flex-col items-center gap-1 hover:text-white"><i data-lucide="truck" class="w-4 h-4"></i><span>Frota</span></button>
    <button onclick="navMobile('inventario')" class="flex flex-col items-center gap-1 hover:text-white"><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>Inventário</span></button>
  </div>

  <script>
    let html5QrCodeScanner = null;
    let skus = [
      { code: 'ROL-6205', lote: 'LOT-2026-B', name: 'Rolamento SKF 6205-2RS', qty: 12, unit: 'UN', loc: 'RACK-A2' },
      { code: 'EPI-CAP-01', lote: 'LOT-2026-A', name: 'Capacete de Segurança MSA', qty: 38, unit: 'UN', loc: 'RACK-B1' }
    ];

    window.onload = function() {
      try {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      } catch(e) {}
      renderMobileSelects();
    };

    function navMobile(page) {
      stopCameraScanner();
      ['home', 'scanner', 'requisitar', 'inventario'].forEach(p => {
        const el = document.getElementById(`mob-page-${p}`);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(`mob-page-${page}`);
      if (target) target.classList.remove('hidden');

      if (page === 'scanner') {
        // Aguarda 100ms para o container aparecer no DOM antes de ligar a câmera
        setTimeout(() => { startCameraScanner(); }, 100);
      }
    }

    function startCameraScanner() {
      if (typeof Html5Qrcode === "undefined") {
        alert("Biblioteca de câmera carregando...");
        return;
      }
      if (html5QrCodeScanner) {
        stopCameraScanner();
      }

      const readerDiv = document.getElementById("interactive-reader");
      if (!readerDiv) return;

      html5QrCodeScanner = new Html5Qrcode("interactive-reader");
      const config = { fps: 15, qrbox: { width: 220, height: 130 } };

      html5QrCodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          handleScannedCode(decodedText);
        },
        () => {}
      ).catch(err => {
        console.warn("Permissão ou erro de câmera:", err);
      });
    }

    function stopCameraScanner() {
      if (html5QrCodeScanner) {
        html5QrCodeScanner.stop().then(() => {
          html5QrCodeScanner.clear();
          html5QrCodeScanner = null;
        }).catch(() => { html5QrCodeScanner = null; });
      }
    }

    function handleScannedCode(code) {
      const cleanCode = code.trim().toUpperCase();
      const item = skus.find(s => s.code === cleanCode);
      if (item) {
        document.getElementById('scan-res-title').innerText = item.name;
        document.getElementById('scan-res-sku').innerText = `SKU: ${item.code} | Lote: ${item.lote}`;
        document.getElementById('scan-res-qty').innerText = `${item.qty} ${item.unit} (Local: ${item.loc})`;
      } else {
        document.getElementById('scan-res-title').innerText = `Código: ${code}`;
        document.getElementById('scan-res-sku').innerText = `Lido com sucesso`;
        document.getElementById('scan-res-qty').innerText = `Pronto para uso`;
      }
      document.getElementById('scanned-result-card').classList.remove('hidden');
    }

    function renderMobileSelects() {
      const opts = '<option value="">-- Selecione o Material --</option>' + 
        skus.map(i => `<option value="${i.code}">${i.code} - ${i.name}</option>`).join('');
      const reqSku = document.getElementById('mob-req-sku');
      const invSku = document.getElementById('mob-inv-sku');
      if (reqSku) reqSku.innerHTML = opts;
      if (invSku) invSku.innerHTML = opts;
    }

    function submitMobileRequisition(e) {
      e.preventDefault();
      alert('Requisição enviada com sucesso!');
      navMobile('home');
    }

    function saveInventoryCount() {
      alert('Contagem cíclica gravada com sucesso!');
      navMobile('home');
    }
  </script>
</body>
</html>
